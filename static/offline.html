<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https: http:" />
    <title>Mafold</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; text-align: center;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: Canvas; color: CanvasText; -webkit-app-region: drag;
      }
      main { max-width: 360px; padding: 24px; }
      h1 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
      p { margin: 0 0 18px; opacity: 0.7; }
      button {
        -webkit-app-region: no-drag; font: inherit; padding: 7px 16px; border-radius: 8px;
        border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); background: transparent; color: inherit; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p id="body"></p>
      <button id="retry" type="button"></button>
    </main>
    <script>
      // The shell hands over its words and where to go back to in the hash
      // (src/main/window.ts). This page is local and has no bridge.
      let info = {};
      try { info = JSON.parse(decodeURIComponent(location.hash.slice(1))); } catch {}
      const target = typeof info.url === "string" && /^https?:\/\//.test(info.url) ? info.url : null;
      document.getElementById("title").textContent = info.title || "Mafold";
      document.getElementById("body").textContent = info.body || "";
      const retry = document.getElementById("retry");
      retry.textContent = info.retry || "Retry";
      const go = () => { if (target) location.href = target; };
      retry.addEventListener("click", go);
      // Come back by ourselves once the site answers again.
      const probe = () => {
        if (!target || !navigator.onLine) return;
        fetch(target, { mode: "no-cors", cache: "no-store" }).then(go, () => {});
      };
      addEventListener("online", probe);
      setInterval(probe, 15000);
    </script>
  </body>
</html>
