# Mafold desktop — release build. This file runs in the PUBLIC repo
# mafold-lab/mafold-desktop (its SSOT is mafold-desktop/.github/workflows/
# release.yml in the monorepo, mirrored there by release-desktop.yml together
# with the rest of this tree). A `v<X.Y.Z>` tag pushed by that mirror starts it.
#
# Public repo ⇒ GitHub-hosted macOS / Windows runners are free (owner,
# 2026-10-05: build here, the same way mafold-cli does).
#
#   build-mac  macos-latest: arm64 + x64 in ONE electron-builder run (so one
#              latest-mac.yml lists both), Developer ID signed + notarized.
#   build-win  windows-latest: per-user NSIS installer, x64, NOT code-signed
#              (owner, 2026-10-05) — SmartScreen asks on first run; updates
#              are verified by the sha512 in latest.yml.
#   publish    R2 (cdn.mafold.com/desktop/stable/, what the in-app updater and
#              the download page read) + a GitHub Release here.
#
# A `v<X.Y.Z>-beta.<N>` tag is a beta: the same build (electron-builder names
# its feeds beta-mac.yml / beta.yml from the version), published by
# scripts/r2-publish.sh to the machines that opted into beta only — never the
# download page's files or the stable feeds — and released here as a
# prerelease.
#
# Secrets on THIS repo:
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD        Developer ID Application (team UGZPUZZYDD)
#   MACOS_NOTARY_KEY_P8_BASE64, MACOS_NOTARY_KEY_ID, MACOS_NOTARY_ISSUER_ID   App Store Connect API key
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET          write access to desktop/ only
name: release

on:
  push:
    # `live/v*` = the monorepo release train taking a held draft live (go-live
    # below). `v*` does not match it (a pattern's `*` stops at `/`).
    tags: ["v*", "live/v*"]

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}

jobs:
  build-mac:
    if: ${{ !startsWith(github.ref_name, 'live/') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # A train rehearsal (`v<X.Y.Z>-dry.<n>`) builds the version in package.json.
      - name: Tag == package.json version
        run: |
          V="$(node -p 'require("./package.json").version')"
          [ "v$V" = "${TAG%%-dry.*}" ] || { echo "::error::tag $TAG != package.json $V"; exit 1; }
      - run: npm ci
      - name: Bundled mafold-cli (pinned, checksummed, must answer status --json)
        run: node scripts/fetch-cli.mjs --mac --check
      # Our own keychain, handed to electron-builder as CSC_KEYCHAIN — NOT
      # CSC_LINK. With CSC_LINK, electron-builder 26 imports the p12 into a temp
      # keychain it creates with a random password, then runs
      # `security set-key-partition-list -k <the p12's password>` on it: the wrong
      # password, which the current macOS runners make a hard failure (v0.1.0's
      # first build, run 37651050514). This is the setup the 2026-10-07 secret
      # probe signed and notarized with on the same runner image.
      - name: Signing keychain
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${P12:-}" ] && [ -n "${P12_PASSWORD:-}" ] || { echo "::error::MACOS_CERT_P12_BASE64 / MACOS_CERT_PASSWORD are not set on this repo"; exit 1; }
          KC="$RUNNER_TEMP/signing.keychain-db"; KP="$(uuidgen)"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/productbuild >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          # The Developer ID intermediates, so codesign can build the chain.
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$KC" >/dev/null 2>&1 || true
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC" | grep -q "Developer ID Application" || { echo "::error::no valid Developer ID Application identity in MACOS_CERT_P12_BASE64"; exit 1; }
          echo "CSC_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: Build, sign, notarize
        env:
          NOTARY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          [ -n "${NOTARY_P8:-}" ] || { echo "::error::MACOS_NOTARY_KEY_P8_BASE64 is not set on this repo"; exit 1; }
          echo "$NOTARY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/notary.p8"
          npm run build
          npx electron-builder --mac --publish never
      # Hard failures, not warnings: an unsigned or un-notarized mac app is
      # blocked by Gatekeeper outright — there is nothing worth shipping. (With
      # no identity found electron-builder only warns and builds unsigned.)
      - name: Signed by our Developer ID, notarized, ticket stapled
        run: |
          set -euo pipefail
          for app in release/mac*/Mafold.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -q '^TeamIdentifier=UGZPUZZYDD$' || { echo "::error::$app is not signed by team UGZPUZZYDD"; exit 1; }
            V="$(spctl --assess --type execute -vv "$app" 2>&1)"; echo "$V"
            echo "$V" | grep -q 'source=Notarized Developer ID' || { echo "::error::Gatekeeper does not accept $app as notarized"; exit 1; }
            xcrun stapler validate "$app"
          done
      # Passkeys (src/main/webauthn.ts) need the keychain group on the app, and
      # that entitlement is restricted: without the embedded profile allowing it
      # macOS kills the app at launch — a release nobody can open. So: profile
      # in, group claimed, helpers clean, and the app actually starts.
      - name: Passkey entitlement authorised, and the app launches
        run: |
          set -euo pipefail
          GROUP=UGZPUZZYDD.com.mafold.desktop.webauthn
          for app in release/mac*/Mafold.app; do
            [ -f "$app/Contents/embedded.provisionprofile" ] || { echo "::error::$app has no embedded provisioning profile"; exit 1; }
            security cms -D -i "$app/Contents/embedded.provisionprofile" | grep -q '<string>UGZPUZZYDD\.\*</string>' || { echo "::error::the profile in $app does not allow the UGZPUZZYDD.* keychain groups"; exit 1; }
            codesign -d --entitlements - --xml "$app" 2>/dev/null | grep -q "$GROUP" || { echo "::error::$app does not claim $GROUP"; exit 1; }
            for helper in "$app"/Contents/Frameworks/*Helper*.app; do
              if codesign -d --entitlements - --xml "$helper" 2>/dev/null | grep -q keychain-access-groups; then echo "::error::$helper claims a keychain group (it has no profile)"; exit 1; fi
            done
          done
          # Launch the one this runner can run natively, in its own profile dir.
          APP="release/mac-$(uname -m)/Mafold.app"
          [ "$(uname -m)" = x86_64 ] && APP=release/mac/Mafold.app
          "$APP/Contents/MacOS/Mafold" --user-data-dir="$RUNNER_TEMP/launch-check" > "$RUNNER_TEMP/launch-check.log" 2>&1 &
          PID=$!
          sleep 15
          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID"
            echo "$APP launched ✓"
          else
            STATUS=0; wait "$PID" || STATUS=$?
            cat "$RUNNER_TEMP/launch-check.log" || true
            echo "::error::$APP exited at launch (status $STATUS) — is the profile authorising its entitlements?"; exit 1
          fi
      - name: The bundled cli kept its own signature
        run: |
          for app in release/mac*/Mafold.app; do
            for cli in "$app"/Contents/Resources/resources/bin/darwin-*/mafold; do
              codesign -dv "$cli" 2>&1 | grep -q 'Identifier=com.mafold.cli' || { echo "::error::$cli was re-signed"; exit 1; }
            done
          done
      # The feed is latest-mac.yml for X.Y.Z, beta-mac.yml for X.Y.Z-beta.N
      # (r2-publish.sh takes the one the version's line needs, and checks it
      # announces this version).
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/beta-mac.yml
          if-no-files-found: error

  build-win:
    if: ${{ !startsWith(github.ref_name, 'live/') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundled mafold-cli (pinned, checksummed, must answer status --json)
        run: node scripts/fetch-cli.mjs --win --check
      - name: Build (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run build
          npx electron-builder --win --publish never
      # latest.yml for X.Y.Z, beta.yml for X.Y.Z-beta.N.
      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/beta.yml
          if-no-files-found: error

  publish:
    needs: [build-mac, build-win]
    if: ${{ !startsWith(github.ref_name, 'live/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # The monorepo's release train mirrors its tag ANNOTATED with
      # `release-train: hold` (and rehearses under `v<X.Y.Z>-dry.<n>`): then
      # NOTHING reaches R2 here — the build lands in a complete DRAFT release,
      # and the train pushes `live/v<X.Y.Z>` once the api is green, which runs
      # `go-live` below. Nothing at all for a rehearsal: it rebuilds a version
      # that may already be out, and its new bytes under the old file names
      # would break every updater's sha512 check. A plain tag (every hand
      # release) publishes here, as before.
      - name: Held by the release train?
        id: hold
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          held=false
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '"\(.object.type) \(.object.sha)"')
          if [ "${ref%% *}" = tag ] \
             && gh api "repos/$GITHUB_REPOSITORY/git/tags/${ref#* }" --jq .message | grep -qx 'release-train: hold'; then
            held=true
          fi
          case "$TAG" in *-dry.*) held=true ;; esac
          echo "held=$held" >> "$GITHUB_OUTPUT"
          [ "$held" = true ] && echo "::notice::$TAG is held by the release train — a draft release, nothing on R2" || true

      - name: Upload to R2 (cdn.mafold.com/desktop/stable/)
        if: steps.hold.outputs.held != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/r2-publish.sh out "${TAG#v}"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          HELD: ${{ steps.hold.outputs.held }}
        # A block scalar, not a plain one: the notes' "Download: https…" is a
        # `key: value` to YAML, and GitHub rejected the whole file over it.
        # A beta is a prerelease: never this repo's "Latest".
        run: |
          draft=""; [ "$HELD" = true ] && draft="--draft"
          pre=""; notes="Mafold for macOS and Windows ${TAG#v}. Download: https://mafold.com/download"
          case "$TAG" in *-beta.*)
            pre="--prerelease"
            notes="Mafold for macOS and Windows ${TAG#v}, a beta: it updates only the machines that opted in. The current release: https://mafold.com/download" ;;
          esac
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --title "Mafold ${TAG#v}" $draft $pre --notes "$notes"

  # The train's switch for a held release: `live/v<X.Y.Z>` pushed by the
  # monorepo once the api is green. Takes the files from the draft (exactly what
  # was built and signed), puts them on R2 in the safe order, then publishes the
  # release, and drops the trigger tag.
  go-live:
    if: startsWith(github.ref_name, 'live/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The held draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REL="${TAG#live/}"
          [ "$(gh release view "$REL" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ] \
            || { echo "::error::$REL is not a held draft — nothing to take live"; exit 1; }
          gh release download "$REL" --repo "$GITHUB_REPOSITORY" --dir out
          ls -l out
      - name: Upload to R2 (cdn.mafold.com/desktop/stable/)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/r2-publish.sh out "${TAG#live/v}"
      - name: Publish the release, drop the trigger tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "${TAG#live/}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
